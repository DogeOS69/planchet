[package]
publish.workspace = true
name = "planchet-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded zero-copy Dogecoin transaction, AuxPoW header and block decoding"

[features]
default = ["alloc"]
alloc = ["planchet-primitives/alloc"]
std = ["alloc", "planchet-primitives/std"]
pow-scrypt = ["alloc", "dep:scrypt"]
keccak = ["planchet-primitives/keccak"]
crypto-backend = ["planchet-primitives/crypto-backend"]

[dependencies]
planchet-primitives = { path = "../planchet-primitives", default-features = false }
scrypt = { version = "0.11.0", optional = true, default-features = false }

[dev-dependencies]
planchet-crypto = { path = "../planchet-crypto", default-features = false }
