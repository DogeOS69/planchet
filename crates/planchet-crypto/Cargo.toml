[package]
publish.workspace = true
name = "planchet-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Portable Rust hashing and prehashed ECDSA with application-installed crypto providers"

[features]
default = []
k256 = ["dep:k256"]
p256 = ["dep:p256"]
keccak = ["dep:sha3"]
# Registration is independent of optional algorithms.
crypto-backend = ["dep:spin", "dep:critical-section"]

[dependencies]
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
sha3 = { version = "0.10.8", default-features = false, optional = true }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"], optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"], optional = true }

[target.'cfg(target_has_atomic = "8")'.dependencies]
spin = { version = "0.10.0", default-features = false, features = ["once"], optional = true }

[target.'cfg(not(target_has_atomic = "8"))'.dependencies]
# The final application supplies its runtime's critical-section implementation.
critical-section = { version = "1.2.0", default-features = false, optional = true }

[dev-dependencies]
hex-literal = "0.4.1"
serde_json = "1.0"
