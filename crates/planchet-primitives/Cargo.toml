[package]
publish.workspace = true
name = "planchet-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Allocation-free Dogecoin hashes, networks, addresses, and exact amounts"

[features]
default = ["alloc"]
alloc = []
std = ["alloc"]
keccak = ["planchet-crypto/keccak"]
crypto-backend = ["planchet-crypto/crypto-backend"]

[dependencies]
planchet-crypto = { path = "../planchet-crypto", default-features = false }
# Digest is used for RIPEMD-160, whose SHA-256 input uses the provider.
digest = { version = "0.10.7", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
bs58 = { version = "0.5.1", default-features = false }
