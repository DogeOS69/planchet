[package]
publish.workspace = true
name = "planchet-rpc-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed Dogecoin Core RPC values with exact decimal amounts"

[features]
default = []

[dependencies]
planchet-primitives = { path = "../planchet-primitives", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }
