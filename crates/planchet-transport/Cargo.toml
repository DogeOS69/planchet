[package]
publish.workspace = true
name = "planchet-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded, credential-redacting Dogecoin RPC transport"

[features]
default = []
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "time"], optional = true }
